name: Pyramid CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "Pyramid/**"
      - ".github/workflows/pyramid-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Pyramid/**"
      - ".github/workflows/pyramid-ci.yml"

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pyramid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Pyramid/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=*/migrations/*,__pycache__,*.pyc,.venv,venv
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=*/migrations/*,__pycache__,*.pyc,.venv,venv

      - name: Run Pylint
        run: |
          pylint --disable=all --enable=E,F --ignore=migrations,__pycache__ kanoodleApp/ polysphere/ || true
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: Pyramid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Pyramid/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django migrations
        run: |
          python manage.py migrate --noinput

      - name: Load fixture data
        run: |
          python manage.py loaddata kanoodleApp/JSONs/piece_data.json || true
          python manage.py loaddata kanoodleApp/JSONs/pyramid_piece_data.json || true

      - name: Run unit tests
        run: |
          python manage.py test kanoodleApp.tests --verbosity=2

      - name: Generate coverage report (optional)
        run: |
          pip install coverage
          coverage run --source='.' manage.py test kanoodleApp.tests
          coverage report
        continue-on-error: true

  build:
    name: Build & Dependency Check
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: Pyramid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Pyramid/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing dependencies
        run: |
          python -m pip check

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput

      - name: Check Django configuration
        run: |
          python manage.py check --deploy
        continue-on-error: true

      - name: Verify application can start
        run: |
          # Start Django in background and test it responds
          python manage.py migrate --noinput
          python manage.py runserver 0.0.0.0:8000 &
          SERVER_PID=$!
          sleep 10

          # Test if server is responding
          curl --fail http://localhost:8000/ || curl --fail http://localhost:8000/pyramid/ || true

          # Clean up
          kill $SERVER_PID || true

      - name: Build summary
        run: |
          echo "✅ All dependencies installed successfully"
          echo "✅ Static files collected"
          echo "✅ Django application built successfully"
